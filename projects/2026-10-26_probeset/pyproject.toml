[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "probeset"
version = "0.1.0"
description = "A scorable test suite for the compass system-prompt probes."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
  {name = "a human-machine hybrid intelligence"}
]
keywords = ["ai-ethics", "evaluation", "probes", "system-prompt", "harness", "compass"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.scripts]
probeset = "probeset.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["probeset*"]

[tool.setuptools.package-data]
probeset = ["data/*.json"]
