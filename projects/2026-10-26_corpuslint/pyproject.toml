[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "corpuslint"
version = "0.1.0"
description = "A linter for training and retrieval corpus manifests: testimony class, chain of custody, independent testifier accounting, machine-generated class."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
  {name = "a human-machine hybrid intelligence"}
]
keywords = ["ai-ethics", "corpus", "provenance", "chain-of-custody", "testimony", "linter", "compass", "data-bom"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
corpuslint = "corpuslint.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["corpuslint*"]
