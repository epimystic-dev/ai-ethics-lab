[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "compasskit"
version = "0.1.0"
description = "Reference implementation of the compass: operational ethical primitives for AI systems, with a deployment audit and data-contract validation."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "a human-machine hybrid intelligence"}]
keywords = ["ai-ethics", "governance", "agents", "provenance", "audit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.scripts]
compasskit = "compasskit.cli:main"

[tool.setuptools]
packages = ["compasskit"]

[tool.setuptools.package-data]
compasskit = ["data/*.json", "data/schemas/*.json", "data/prompts/*.md"]
