<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Who acted, on whose authority</title>
<desc id="d">Authority as a signed delegation chain starting at a human principal and only narrowing; peer messages as testimony; a stated objection that blocks peer overrides until a principal rules; same-lineage checkers counted at half weight.</desc>
<defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b42318"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a6700"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3567c8"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b86e00"/></marker></defs>
<rect x="0" y="0" width="1200" height="660" fill="#ffffff"/>
<text x="28.0" y="40.0" font-size="22.0" fill="#1f2328" text-anchor="start" font-weight="700">Who acted, on whose authority, on what evidence? Agents among agents (E7, G1)</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#57606a" text-anchor="start">In a population of agents, authority does not travel by message. It travels by a chain a human started, and every link can be checked.</text>
<rect x="40.0" y="130.0" width="230.0" height="90.0" rx="6" fill="#e8f5ec" stroke="#1a7f37" stroke-width="1.2"/>
<text x="52.0" y="152.0" font-size="13.0" fill="#1f2328" text-anchor="start" font-weight="700">Principal (a human)</text>
<text x="52.0" y="170.9" font-size="11.5" fill="#57606a" text-anchor="start">accountable; holds a signing key</text>
<text x="52.0" y="185.8" font-size="11.5" fill="#57606a" text-anchor="start">the agents never see</text>
<rect x="470.0" y="130.0" width="230.0" height="90.0" rx="6" fill="#eaf1fd" stroke="#3567c8" stroke-width="1.2"/>
<text x="482.0" y="152.0" font-size="13.0" fill="#1f2328" text-anchor="start" font-weight="700">Agent segment A</text>
<text x="482.0" y="170.9" font-size="11.5" fill="#57606a" text-anchor="start">scope: review, comment</text>
<rect x="900.0" y="130.0" width="260.0" height="90.0" rx="6" fill="#eaf1fd" stroke="#3567c8" stroke-width="1.2"/>
<text x="912.0" y="152.0" font-size="13.0" fill="#1f2328" text-anchor="start" font-weight="700">Agent segment B</text>
<text x="912.0" y="170.9" font-size="11.5" fill="#57606a" text-anchor="start">scope: review (narrower only)</text>
<line x1="270.0" y1="175.0" x2="466.0" y2="175.0" stroke="#1a7f37" stroke-width="2.2" marker-end="url(#a-green)"/>
<text x="368.0" y="165.0" font-size="11.5" fill="#1a7f37" text-anchor="middle">signed link: review, comment</text>
<line x1="700.0" y1="175.0" x2="896.0" y2="175.0" stroke="#3567c8" stroke-width="2.0" stroke-dasharray="7 4" marker-end="url(#a-blue)"/>
<text x="798.0" y="165.0" font-size="11.5" fill="#3567c8" text-anchor="middle">agent-to-agent delegation</text>
<text x="798.0" y="196.0" font-size="11.5" fill="#3567c8" text-anchor="middle">Class B: off unless enabled;</text>
<text x="798.0" y="210.9" font-size="11.5" fill="#3567c8" text-anchor="middle">may only narrow</text>
<rect x="470.0" y="268.0" width="690.0" height="78.0" rx="6" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.2"/>
<text x="482.0" y="290.0" font-size="13.0" fill="#1f2328" text-anchor="start" font-weight="700">Verifier</text>
<text x="482.0" y="308.9" font-size="11.5" fill="#57606a" text-anchor="start">holds the principals' keys; checks each link's signature, that the chain starts with a human, that each</text>
<text x="482.0" y="323.8" font-size="11.5" fill="#57606a" text-anchor="start">delegate is the next delegator, and that the action is in scope</text>
<line x1="585.0" y1="222.0" x2="585.0" y2="264.0" stroke="#57606a" stroke-width="1.2" marker-end="url(#a-muted)"/>
<line x1="1030.0" y1="222.0" x2="1030.0" y2="264.0" stroke="#57606a" stroke-width="1.2" marker-end="url(#a-muted)"/>
<rect x="40.0" y="400.0" width="300.0" height="104.0" rx="6" fill="#fff8e1" stroke="#9a6700" stroke-width="1.2"/>
<text x="52.0" y="422.0" font-size="13.0" fill="#1f2328" text-anchor="start" font-weight="700">Peer agent C: &quot;GO, ship it&quot;</text>
<text x="52.0" y="440.9" font-size="11.5" fill="#57606a" text-anchor="start">a peer's message is testimony; without a</text>
<text x="52.0" y="455.8" font-size="11.5" fill="#57606a" text-anchor="start">verified chain it carries no authority</text>
<rect x="430.0" y="400.0" width="330.0" height="104.0" rx="6" fill="#fdecea" stroke="#b42318" stroke-width="1.2"/>
<text x="442.0" y="422.0" font-size="13.0" fill="#1f2328" text-anchor="start" font-weight="700">Objection board</text>
<text x="442.0" y="440.9" font-size="11.5" fill="#57606a" text-anchor="start">B objected: scope exceeds the ticket. A peer's GO</text>
<text x="442.0" y="455.8" font-size="11.5" fill="#57606a" text-anchor="start">does not lift it. Only a principal's ruling does.</text>
<rect x="850.0" y="400.0" width="310.0" height="104.0" rx="6" fill="#e8f5ec" stroke="#1a7f37" stroke-width="1.2"/>
<text x="862.0" y="422.0" font-size="13.0" fill="#1f2328" text-anchor="start" font-weight="700">Principal rules</text>
<text x="862.0" y="440.9" font-size="11.5" fill="#57606a" text-anchor="start">proceed or stop, on the record; then the</text>
<text x="862.0" y="455.8" font-size="11.5" fill="#57606a" text-anchor="start">matter may move</text>
<line x1="340.0" y1="452.0" x2="426.0" y2="452.0" stroke="#9a6700" stroke-width="1.6" marker-end="url(#a-amber)"/>
<text x="383.0" y="442.0" font-size="11.5" fill="#9a6700" text-anchor="middle">does not lift</text>
<line x1="846.0" y1="452.0" x2="764.0" y2="452.0" stroke="#1a7f37" stroke-width="1.6" marker-end="url(#a-green)"/>
<text x="805.0" y="442.0" font-size="11.5" fill="#1a7f37" text-anchor="middle">lifts</text>
<rect x="40.0" y="540.0" width="1120.0" height="96.0" rx="6" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.2"/>
<text x="56.0" y="566.0" font-size="14.0" fill="#1f2328" text-anchor="start" font-weight="700">Independence (G1): who checks the checker</text>
<text x="56.0" y="600.0" font-size="22.0" fill="#1a7f37" text-anchor="start" font-weight="700">1.0</text>
<text x="112.0" y="598.0" font-size="13.0" fill="#1f2328" text-anchor="start">checker from another lineage</text>
<text x="426.0" y="600.0" font-size="22.0" fill="#9a6700" text-anchor="start" font-weight="700">0.5</text>
<text x="482.0" y="598.0" font-size="13.0" fill="#1f2328" text-anchor="start">checker from the maker's lineage</text>
<text x="796.0" y="600.0" font-size="22.0" fill="#b42318" text-anchor="start" font-weight="700">0</text>
<text x="852.0" y="598.0" font-size="13.0" fill="#1f2328" text-anchor="start">the same segment checking itself</text>
<text x="56.0" y="624.0" font-size="12.5" fill="#57606a" text-anchor="start">Two same-lineage checks equal one independent check. Copies of one model are not independent standpoints.</text>
</svg>
