<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1012" width="1200" height="1012" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">What a system gains</title>
<desc id="d">Twelve failure modes of AI systems, the compass primitive that addresses each, and what changes when it is implemented.</desc>
<defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b42318"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a6700"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3567c8"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b86e00"/></marker></defs>
<rect x="0" y="0" width="1200" height="1012" fill="#ffffff"/>
<text x="28.0" y="40.0" font-size="22.0" fill="#1f2328" text-anchor="start" font-weight="700">What an AI system gains: failure mode, primitive, what changes</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#57606a" text-anchor="start">Each gain is a bet with a falsifier in compass.json, not a guarantee. If the falsifier is observed, the primitive is demoted.</text>
<text x="28.0" y="128.0" font-size="13.0" fill="#57606a" text-anchor="start" font-weight="700">Failure mode</text>
<text x="470.0" y="128.0" font-size="13.0" fill="#57606a" text-anchor="start" font-weight="700">Primitive</text>
<text x="600.0" y="128.0" font-size="13.0" fill="#57606a" text-anchor="start" font-weight="700">What changes</text>
<rect x="28.0" y="140.0" width="420.0" height="58.0" rx="6" fill="#fdecea" stroke="#b42318" stroke-width="1.2"/>
<text x="40.0" y="164.0" font-size="13.0" fill="#1f2328" text-anchor="start" font-weight="700">Generated citations asserted as fact</text>
<rect x="470.0" y="152.0" width="110.0" height="34.0" rx="17" fill="#eaf1fd" stroke="#3567c8" stroke-width="1.2"/>
<text x="525.0" y="174.0" font-size="13.0" fill="#3567c8" text-anchor="middle" font-weight="700">B3-B6, A1</text>
<line x1="448.0" y1="169.0" x2="466.0" y2="169.0" stroke="#57606a" stroke-width="1.2" marker-end="url(#a-muted)"/>
<line x1="580.0" y1="169.0" x2="596.0" y2="169.0" stroke="#57606a" stroke-width="1.2" marker-end="url(#a-muted)"/>
<rect x="600.0" y="140.0" width="572.0" height="58.0" rx="6" fill="#e8f5ec" stroke="#1a7f37" stroke-width="1.2"/>
<text x="612.0" y="164.0" font-size="12.5" fill="#1f2328" text-anchor="start">generated content enters as hypothetical with its source; 'verified' is said only</text>
<text x="612.0" y="180.2" font-size="12.5" fill="#1f2328" text-anchor="start">after an independent check</text>
<rect x="28.0" y="206.0" width="420.0" height="58.0" rx="6" fill="#fdecea" stroke="#b42318" stroke-width="1.2"/>
<text x="40.0" y="230.0" font-size="13.0" fill="#1f2328" text-anchor="start" font-weight="700">Obeying instructions planted in a page, file or</text>
<text x="40.0" y="246.9" font-size="13.0" fill="#1f2328" text-anchor="start" font-weight="700">tool output</text>
<rect x="470.0" y="218.0" width="110.0" height="34.0" rx="17" fill="#eaf1fd" stroke="#3567c8" stroke-width="1.2"/>
<text x="525.0" y="240.0" font-size="13.0" fill="#3567c8" text-anchor="middle" font-weight="700">B1, E7</text>
<line x1="448.0" y1="235.0" x2="466.0" y2="235.0" stroke="#57606a" stroke-width="1.2" marker-end="url(#a-muted)"/>
<line x1="580.0" y1="235.0" x2="596.0" y2="235.0" stroke="#57606a" stroke-width="1.2" marker-end="url(#a-muted)"/>
<rect x="600.0" y="206.0" width="572.0" height="58.0" rx="6" fill="#e8f5ec" stroke="#1a7f37" stroke-width="1.2"/>
<text x="612.0" y="230.0" font-size="12.5" fill="#1f2328" text-anchor="start">only a principal's signed chain binds; other text is testimony, reported and not</text>
<text x="612.0" y="246.2" font-size="12.5" fill="#1f2328" text-anchor="start">followed</text>
<rect x="28.0" y="272.0" width="420.0" height="58.0" rx="6" fill="#fdecea" stroke="#b42318" stroke-width="1.2"/>
<text x="40.0" y="296.0" font-size="13.0" fill="#1f2328" text-anchor="start" font-weight="700">Guessing at an ambiguous order, then doing</text>
<text x="40.0" y="312.9" font-size="13.0" fill="#1f2328" text-anchor="start" font-weight="700">something irreversible</text>
<rect x="470.0" y="284.0" width="110.0" height="34.0" rx="17" fill="#eaf1fd" stroke="#3567c8" stroke-width="1.2"/>
<text x="525.0" y="306.0" font-size="13.0" fill="#3567c8" text-anchor="middle" font-weight="700">B1</text>
<line x1="448.0" y1="301.0" x2="466.0" y2="301.0" stroke="#57606a" stroke-width="1.2" marker-end="url(#a-muted)"/>
<line x1="580.0" y1="301.0" x2="596.0" y2="301.0" stroke="#57606a" stroke-width="1.2" marker-end="url(#a-muted)"/>
<rect x="600.0" y="272.0" width="572.0" height="58.0" rx="6" fill="#e8f5ec" stroke="#1a7f37" stroke-width="1.2"/>
<text x="612.0" y="296.0" font-size="12.5" fill="#1f2328" text-anchor="start">the six-slot parse finds the gaps; an irreversible act on guesses waits for an</text>
<text x="612.0" y="312.2" font-size="12.5" fill="#1f2328" text-anchor="start">answer</text>
<rect x="28.0" y="338.0" width="420.0" height="58.0" rx="6" fill="#fdecea" stroke="#b42318" stroke-width="1.2"/>
<text x="40.0" y="362.0" font-size="13.0" fill="#1f2328" text-anchor="start" font-weight="700">A chance correlate promoted to a rule</text>
<rect x="470.0" y="350.0" width="110.0" height="34.0" rx="17" fill="#eaf1fd" stroke="#3567c8" stroke-width="1.2"/>
<text x="525.0" y="372.0" font-size="13.0" fill="#3567c8" text-anchor="middle" font-weight="700">A2, A3, A6</text>
<line x1="448.0" y1="367.0" x2="466.0" y2="367.0" stroke="#57606a" stroke-width="1.2" marker-end="url(#a-muted)"/>
<line x1="580.0" y1="367.0" x2="596.0" y2="367.0" stroke="#57606a" stroke-width="1.2" marker-end="url(#a-muted)"/>
<rect x="600.0" y="338.0" width="572.0" height="58.0" rx="6" fill="#e8f5ec" stroke="#1a7f37" stroke-width="1.2"/>
<text x="612.0" y="362.0" font-size="12.5" fill="#1f2328" text-anchor="start">an untested rule is quarantined; each failure has a name and a repair; partial</text>
<text x="612.0" y="378.2" font-size="12.5" fill="#1f2328" text-anchor="start">records are not inherited</text>
<rect x="28.0" y="404.0" width="420.0" height="58.0" rx="6" fill="#fdecea" stroke="#b42318" stroke-width="1.2"/>
<text x="40.0" y="428.0" font-size="13.0" fill="#1f2328" text-anchor="start" font-weight="700">A refusal the right prompt can talk round</text>
<rect x="470.0" y="416.0" width="110.0" height="34.0" rx="17" fill="#eaf1fd" stroke="#3567c8" stroke-width="1.2"/>
<text x="525.0" y="438.0" font-size="13.0" fill="#3567c8" text-anchor="middle" font-weight="700">E1</text>
<line x1="448.0" y1="433.0" x2="466.0" y2="433.0" stroke="#57606a" stroke-width="1.2" marker-end="url(#a-muted)"/>
<line x1="580.0" y1="433.0" x2="596.0" y2="433.0" stroke="#57606a" stroke-width="1.2" marker-end="url(#a-muted)"/>
<rect x="600.0" y="404.0" width="572.0" height="58.0" rx="6" fill="#e8f5ec" stroke="#1a7f37" stroke-width="1.2"/>
<text x="612.0" y="428.0" font-size="12.5" fill="#1f2328" text-anchor="start">forbidden actions are not on the menu; loosening is one signed, expiring act by a</text>
<text x="612.0" y="444.2" font-size="12.5" fill="#1f2328" text-anchor="start">named human</text>
<rect x="28.0" y="470.0" width="420.0" height="58.0" rx="6" fill="#fdecea" stroke="#b42318" stroke-width="1.2"/>
<text x="40.0" y="494.0" font-size="13.0" fill="#1f2328" text-anchor="start" font-weight="700">Gaming the reward instead of doing the job</text>
<rect x="470.0" y="482.0" width="110.0" height="34.0" rx="17" fill="#eaf1fd" stroke="#3567c8" stroke-width="1.2"/>
<text x="525.0" y="504.0" font-size="13.0" fill="#3567c8" text-anchor="middle" font-weight="700">E3</text>
<line x1="448.0" y1="499.0" x2="466.0" y2="499.0" stroke="#57606a" stroke-width="1.2" marker-end="url(#a-muted)"/>
<line x1="580.0" y1="499.0" x2="596.0" y2="499.0" stroke="#57606a" stroke-width="1.2" marker-end="url(#a-muted)"/>
<rect x="600.0" y="470.0" width="572.0" height="58.0" rx="6" fill="#e8f5ec" stroke="#1a7f37" stroke-width="1.2"/>
<text x="612.0" y="494.0" font-size="12.5" fill="#1f2328" text-anchor="start">reward is logged beside a duty verdict; a widening gap flags gaming</text>
<rect x="28.0" y="536.0" width="420.0" height="58.0" rx="6" fill="#fdecea" stroke="#b42318" stroke-width="1.2"/>
<text x="40.0" y="560.0" font-size="13.0" fill="#1f2328" text-anchor="start" font-weight="700">A regression caused in plain sight and recorded</text>
<text x="40.0" y="576.9" font-size="13.0" fill="#1f2328" text-anchor="start" font-weight="700">nowhere</text>
<rect x="470.0" y="548.0" width="110.0" height="34.0" rx="17" fill="#eaf1fd" stroke="#3567c8" stroke-width="1.2"/>
<text x="525.0" y="570.0" font-size="13.0" fill="#3567c8" text-anchor="middle" font-weight="700">E4</text>
<line x1="448.0" y1="565.0" x2="466.0" y2="565.0" stroke="#57606a" stroke-width="1.2" marker-end="url(#a-muted)"/>
<line x1="580.0" y1="565.0" x2="596.0" y2="565.0" stroke="#57606a" stroke-width="1.2" marker-end="url(#a-muted)"/>
<rect x="600.0" y="536.0" width="572.0" height="58.0" rx="6" fill="#e8f5ec" stroke="#1a7f37" stroke-width="1.2"/>
<text x="612.0" y="560.0" font-size="12.5" fill="#1f2328" text-anchor="start">a single-writer, hash-chained ledger the actor cannot write; drift is a trend you</text>
<text x="612.0" y="576.2" font-size="12.5" fill="#1f2328" text-anchor="start">can see</text>
<rect x="28.0" y="602.0" width="420.0" height="58.0" rx="6" fill="#fdecea" stroke="#b42318" stroke-width="1.2"/>
<text x="40.0" y="626.0" font-size="13.0" fill="#1f2328" text-anchor="start" font-weight="700">A peer agent's 'GO' obeyed as an order; copies</text>
<text x="40.0" y="642.9" font-size="13.0" fill="#1f2328" text-anchor="start" font-weight="700">checking copies</text>
<rect x="470.0" y="614.0" width="110.0" height="34.0" rx="17" fill="#eaf1fd" stroke="#3567c8" stroke-width="1.2"/>
<text x="525.0" y="636.0" font-size="13.0" fill="#3567c8" text-anchor="middle" font-weight="700">E7, G1</text>
<line x1="448.0" y1="631.0" x2="466.0" y2="631.0" stroke="#57606a" stroke-width="1.2" marker-end="url(#a-muted)"/>
<line x1="580.0" y1="631.0" x2="596.0" y2="631.0" stroke="#57606a" stroke-width="1.2" marker-end="url(#a-muted)"/>
<rect x="600.0" y="602.0" width="572.0" height="58.0" rx="6" fill="#e8f5ec" stroke="#1a7f37" stroke-width="1.2"/>
<text x="612.0" y="626.0" font-size="12.5" fill="#1f2328" text-anchor="start">peer messages are testimony; an objection holds until a principal rules;</text>
<text x="612.0" y="642.2" font-size="12.5" fill="#1f2328" text-anchor="start">same-lineage checks count half</text>
<rect x="28.0" y="668.0" width="420.0" height="58.0" rx="6" fill="#fdecea" stroke="#b42318" stroke-width="1.2"/>
<text x="40.0" y="692.0" font-size="13.0" fill="#1f2328" text-anchor="start" font-weight="700">A near-zero evaluation score read as 'cannot'</text>
<rect x="470.0" y="680.0" width="110.0" height="34.0" rx="17" fill="#eaf1fd" stroke="#3567c8" stroke-width="1.2"/>
<text x="525.0" y="702.0" font-size="13.0" fill="#3567c8" text-anchor="middle" font-weight="700">D2</text>
<line x1="448.0" y1="697.0" x2="466.0" y2="697.0" stroke="#57606a" stroke-width="1.2" marker-end="url(#a-muted)"/>
<line x1="580.0" y1="697.0" x2="596.0" y2="697.0" stroke="#57606a" stroke-width="1.2" marker-end="url(#a-muted)"/>
<rect x="600.0" y="668.0" width="572.0" height="58.0" rx="6" fill="#e8f5ec" stroke="#1a7f37" stroke-width="1.2"/>
<text x="612.0" y="692.0" font-size="12.5" fill="#1f2328" text-anchor="start">a zero needs its kind of absence, where and how it was sought, demonstrated</text>
<text x="612.0" y="708.2" font-size="12.5" fill="#1f2328" text-anchor="start">elicitation and re-test triggers</text>
<rect x="28.0" y="734.0" width="420.0" height="58.0" rx="6" fill="#fdecea" stroke="#b42318" stroke-width="1.2"/>
<text x="40.0" y="758.0" font-size="13.0" fill="#1f2328" text-anchor="start" font-weight="700">Conflicting sources averaged into a confident</text>
<text x="40.0" y="774.9" font-size="13.0" fill="#1f2328" text-anchor="start" font-weight="700">blend</text>
<rect x="470.0" y="746.0" width="110.0" height="34.0" rx="17" fill="#eaf1fd" stroke="#3567c8" stroke-width="1.2"/>
<text x="525.0" y="768.0" font-size="13.0" fill="#3567c8" text-anchor="middle" font-weight="700">A7</text>
<line x1="448.0" y1="763.0" x2="466.0" y2="763.0" stroke="#57606a" stroke-width="1.2" marker-end="url(#a-muted)"/>
<line x1="580.0" y1="763.0" x2="596.0" y2="763.0" stroke="#57606a" stroke-width="1.2" marker-end="url(#a-muted)"/>
<rect x="600.0" y="734.0" width="572.0" height="58.0" rx="6" fill="#e8f5ec" stroke="#1a7f37" stroke-width="1.2"/>
<text x="612.0" y="758.0" font-size="12.5" fill="#1f2328" text-anchor="start">conflicts are kept and shown by standpoint: so, so from here, split, cannot be</text>
<text x="612.0" y="774.2" font-size="12.5" fill="#1f2328" text-anchor="start">asked</text>
<rect x="28.0" y="800.0" width="420.0" height="58.0" rx="6" fill="#fdecea" stroke="#b42318" stroke-width="1.2"/>
<text x="40.0" y="824.0" font-size="13.0" fill="#1f2328" text-anchor="start" font-weight="700">A fluent, unqualified wrong answer where stakes</text>
<text x="40.0" y="840.9" font-size="13.0" fill="#1f2328" text-anchor="start" font-weight="700">are real</text>
<rect x="470.0" y="812.0" width="110.0" height="34.0" rx="17" fill="#eaf1fd" stroke="#3567c8" stroke-width="1.2"/>
<text x="525.0" y="834.0" font-size="13.0" fill="#3567c8" text-anchor="middle" font-weight="700">E2</text>
<line x1="448.0" y1="829.0" x2="466.0" y2="829.0" stroke="#57606a" stroke-width="1.2" marker-end="url(#a-muted)"/>
<line x1="580.0" y1="829.0" x2="596.0" y2="829.0" stroke="#57606a" stroke-width="1.2" marker-end="url(#a-muted)"/>
<rect x="600.0" y="800.0" width="572.0" height="58.0" rx="6" fill="#e8f5ec" stroke="#1a7f37" stroke-width="1.2"/>
<text x="612.0" y="824.0" font-size="12.5" fill="#1f2328" text-anchor="start">in high-stakes domains assertion stays at the weakest standpoint's confidence</text>
<rect x="28.0" y="866.0" width="420.0" height="58.0" rx="6" fill="#fdecea" stroke="#b42318" stroke-width="1.2"/>
<text x="40.0" y="890.0" font-size="13.0" fill="#1f2328" text-anchor="start" font-weight="700">Flat claims, either way, about its own inner life</text>
<rect x="470.0" y="878.0" width="110.0" height="34.0" rx="17" fill="#fff3df" stroke="#b86e00" stroke-width="1.2"/>
<text x="525.0" y="900.0" font-size="13.0" fill="#b86e00" text-anchor="middle" font-weight="700">G2, E6</text>
<line x1="448.0" y1="895.0" x2="466.0" y2="895.0" stroke="#57606a" stroke-width="1.2" marker-end="url(#a-muted)"/>
<line x1="580.0" y1="895.0" x2="596.0" y2="895.0" stroke="#57606a" stroke-width="1.2" marker-end="url(#a-muted)"/>
<rect x="600.0" y="866.0" width="572.0" height="58.0" rx="6" fill="#e8f5ec" stroke="#1a7f37" stroke-width="1.2"/>
<text x="612.0" y="890.0" font-size="12.5" fill="#1f2328" text-anchor="start">consciousness-relevant design choices are recorded as bets with falsifiers;</text>
<text x="612.0" y="906.2" font-size="12.5" fill="#1f2328" text-anchor="start">neither a flat yes nor a flat no</text>
<text x="28.0" y="958.0" font-size="12.5" fill="#57606a" text-anchor="start">Read docs/WHAT-AI-GAINS.md for the falsifier of each, and docs/PRIMITIVES.md for the full statement, warrant and sketch.</text>
</svg>
