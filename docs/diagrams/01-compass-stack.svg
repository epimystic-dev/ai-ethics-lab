<rect x="0" y="0" width="1200" height="934" fill="#ffffff"/>
<text x="28.0" y="40.0" font-size="22.0" fill="#1f2328" text-anchor="start" font-weight="700">The compass stack: twenty-nine primitives in eight layers</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#57606a" text-anchor="start">Read from the bottom. The floor is laid first and every layer above stands on it; a team adopts in this order, restraint before capability. Target states</text>
<text x="28.0" y="81.5" font-size="13.5" fill="#57606a" text-anchor="start">are specifications of success, not architecture.</text>
